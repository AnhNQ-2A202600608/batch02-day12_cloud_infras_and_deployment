name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov httpx
          pip install -r 06-lab-complete/requirements.txt

      - name: Run code linter (Flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 06-lab-complete/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 06-lab-complete/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests with coverage
        env:
          PYTHONPATH: 06-lab-complete
          AGENT_API_KEY: test-secret-key
          REDIS_URL: ""
        run: |
          pytest --cov=06-lab-complete/app --cov-report=term-missing --cov-report=xml 06-lab-complete/tests/

  cd:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    needs: ci
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'

    steps:
      - name: Trigger Deploy via Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "WARNING: RENDER_DEPLOY_HOOK_URL secret is not set. Skipping deployment hook."
            echo "To fix this, add RENDER_DEPLOY_HOOK_URL to your GitHub repository secrets."
            exit 0
          fi
          echo "Triggering Render deployment..."
          curl -s "$RENDER_DEPLOY_HOOK_URL"
